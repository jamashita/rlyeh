name: 'CI'
on:
  pull_request:
    branches:
      - 'develop'
  workflow_dispatch:
jobs:
  ci:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
      - name: 'Use Node.js 24'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
      - name: 'Use Bun'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: '1.3.5'
      - name: 'Set up'
        run: 'bun install --frozen-lockfile'
      - name: 'Typecheck'
        run: 'bun run typecheck'
      - name: 'Test'
        run: 'bun run examine'
      - name: 'Build'
        run: 'bun run build'
