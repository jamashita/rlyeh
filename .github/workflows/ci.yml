name: 'CI'
on:
  pull_request:
    branches:
      - 'develop'
  workflow_dispatch:
jobs:
  ci:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v7'
      - name: 'Use Bun 1.3.5'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: '1.3.5'
      - name: 'Set up'
        run: 'bun install --frozen-lockfile'
      - name: 'Test'
        run: 'bun examine'
