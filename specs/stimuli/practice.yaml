# 練習用の刺激（全参加者に固定で提示し、分析対象外）
#
# 構成:
#   propositions: 言語に依存しない命題のリスト。summary は作成者向けの説明で、プログラムは使わない。
#                 並び順は日本語版の本文での登場順としているが、言語によって登場順が異なってもよい。
#   questions:    言語に依存しない設問の定義。
#                 answer は正答の選択肢 ID。「本文からはわからない」が正答の場合は not-in-text とする。
#                 options は具体的な回答候補五つの ID。表示時にシャッフルし、「本文からはわからない」は常に最後に置く。
#                 trope は設問で問う事実が物語の定番どおりか（follows）、定番から外したか（subverted）、
#                 定番と関係しないか（none）を表す（AGENTS.md §3.2）。
#   locales:      言語ごとの本文・設問文・選択肢の文言。キーは Language のタグ（ja-Jpan、en-Latn）。
#                 notInText は「本文からはわからない」の文言。
#                 text は参加者が読む本文そのもの。
#                 spans には、命題ごとに、その内容を担う部分を本文からそのまま引用する（AGENTS.md §10.1）。
#                   - すべての命題について、本文中にちょうど1回だけ現れる部分を引用する。
#                     同じ語句が本文に2回以上現れる場合は、1回だけになるまで引用を長くする。
#                   - 引用どうしは重ならないようにする。どの命題にも属さない部分は引用しなくてよい。
#                   - 命題の位置（本文の先頭から何文字目か）は、引用が現れる位置から書記素単位で数える。
#                 登場人物の名前は、各言語の母語話者にとって馴染みのある名前にする（言語ごとに異なってよい）。
#                 命題と選択肢 ID では、名前ではなく「女性」「男性」で人物を表す。
#                   女性（woman）: ja 美咲 / en Mira
#                   男性（man）  : ja 健太 / en Thomas

id: practice
role: practice

# 設問の種類ごとの配分（AGENTS.md §4.1）:
#   recognition（単語が見えれば答えられる）: q01, q02, q03, q04, q05
#   relation（単語だけでは答えられない）  : q06, q07, q08
#   inference（考える必要がある）         : q09
#   not-in-text（本文からはわからない）   : q10

propositions:
  - id: p01
    summary: 出来事は嵐の翌朝に起きた
  - id: p02
    summary: 箱を見つけたのは女性である
  - id: p03
    summary: 箱は倒れた木のそばにあった
  - id: p04
    summary: 箱には白い円が四つ描かれていた
  - id: p05
    summary: 箱は黒かった
  - id: p06
    summary: 女性は長老と男性を連れて戻った
  - id: p07
    summary: 男性が円の一つに触れた
  - id: p08
    summary: 触れられた円は黄色に光った
  - id: p09
    summary: 箱は、長老が名前を呼ぶまで何も話さなかった

questions:
  - id: q01
    proposition: p01
    kind: recognition
    trope: none
    answer: storm-morning
    options: [storm-morning, snowy-night, foggy-noon, rainy-evening, festival-morning]
  - id: q02
    proposition: p03
    kind: recognition
    trope: follows
    answer: fallen-tree
    options: [fallen-tree, riverbank, old-well, under-rock, field-fence]
  - id: q03
    proposition: p04
    kind: recognition
    trope: subverted
    answer: four
    options: [two, three, four, five, six]
  - id: q04
    proposition: p05
    kind: recognition
    trope: none
    answer: black
    options: [black, brown, gray, red, green]
  - id: q05
    proposition: p08
    kind: recognition
    trope: subverted
    answer: yellow
    options: [yellow, blue, red, green, purple]
  - id: q06
    proposition: p02
    kind: relation
    trope: subverted
    answer: woman
    options: [man, elder, woman, blacksmith, shepherd]
  - id: q07
    proposition: p07
    kind: relation
    trope: subverted
    answer: man
    options: [man, elder, woman, blacksmith, shepherd]
  - id: q08
    proposition: p09
    kind: relation
    trope: none
    answer: elder-called
    options: [elder-called, woman-called, man-called, someone-sang, rain-started]
  - id: q09
    proposition: p06
    kind: inference
    trope: none
    answer: woman
    options: [woman, elder, man, blacksmith, shepherd]
  - id: q10
    proposition: p05
    kind: not-in-text
    trope: none
    answer: not-in-text
    options: [coins, letters, seeds, tools, cloth]

