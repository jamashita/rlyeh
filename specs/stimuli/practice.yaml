          under-rock: 大きな岩の下
          field-fence: 畑の柵の近く
      q10:
        prompt: 物体に描かれていた円はいくつでしたか？
        options:
          one: 一つ
          two: 二つ
          three: 三つ
          four: 四つ
          five: 五つ
  en-Latn:
    text: >-
      {p01:The morning after a storm, Mira left her village to inspect the fields on its east side.} {p03:Near a fallen tree}, {p02:she discovered} {p04:a black metal object marked with four white circles}. {p05:She returned to the village and brought the elder and a man named Thomas to the site.} {p06:The elder examined the area around the object without touching it}, but {p07:Thomas placed his hand on one of the circles}. A few seconds later, {p08:the circles turned yellow} and {p09:the object transformed into a human-shaped machine}. {p10:The machine said nothing until Mira approached it}. It then explained that {p11:it had been buried underground for many years} and that {p12:the storm had finally exposed it}. Before returning to the village, {p13:the elder tied a red cloth to the fallen tree so that the location could be found again}.
