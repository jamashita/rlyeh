# 練習用の刺激（全参加者に固定で提示し、分析対象外）
#
# 構成:
#   propositions: 言語に依存しない命題のリスト。summary は作成者向けの説明で、プログラムは使わない。
#                 並び順は日本語版の本文での登場順としているが、言語によって登場順が異なってもよい。
#   questions:    言語に依存しない設問の定義。
#                 answer は正答の選択肢 ID。「本文からはわからない」が正答の場合は not-in-text とする。
#                 options は具体的な回答候補五つの ID。表示時にシャッフルし、「本文からはわからない」は常に最後に置く。
#                 trope は設問で問う事実が物語の定番どおりか（follows）、定番から外したか（subverted）、
#                 定番と関係しないか（none）を表す（AGENTS.md §3.2）。
#   locales:      言語ごとの本文・設問文・選択肢の文言。キーは Language のタグ（ja-Jpan、en-Latn）。
#                 notInText は「本文からはわからない」の文言。
#                 text では、各命題の内容を担う部分を {p01:…} の形で囲む（AGENTS.md §10）。
#                   - すべての命題を各言語の本文でちょうど1回ずつ囲む。
#                   - 囲みは入れ子にせず、重ねない。どの命題にも属さない部分は囲まなくてよい。
#                   - 参加者に表示するときは囲みの記号を取り除く。
#                   - 命題の位置（本文の先頭から何文字目か）は、囲みの開始位置と終了位置から書記素単位で数える。
#                 登場人物の名前は、各言語の母語話者にとって馴染みのある名前にする（言語ごとに異なってよい）。
#                 命題と選択肢 ID では、名前ではなく「女性」「男性」で人物を表す。
#                   女性（woman）: ja 美咲 / en Mira
#                   男性（man）  : ja 健太 / en Thomas

id: practice
role: practice

propositions:
  - id: p01
    summary: 嵐の翌朝、女性が村の東側にある畑を調べるため村を出た
  - id: p02
    summary: 物体を発見したのは女性である
  - id: p03
    summary: 物体は倒れた木のそばで見つかった
  - id: p04
    summary: 物体は黒い金属製で、四つの白い円が描かれていた
  - id: p05
    summary: 女性が村へ戻り、長老と男性を現場へ連れてきた
  - id: p06
    summary: 長老は物体に触れずに周囲を調べた
  - id: p07
    summary: 男性が円の一つに触れた
  - id: p08
    summary: 数秒後、円が黄色に変わった
  - id: p09
    summary: 物体が人間の形をした機械に変形した
  - id: p10
    summary: 機械は女性が近づくまで何も話さなかった
  - id: p11
    summary: 機械は自分が長年地中に埋まっていたと説明した
  - id: p12
    summary: 機械は嵐によって地上に露出したと説明した
  - id: p13
    summary: 長老が倒れた木に赤い布を結びつけた

questions:
  - id: q01
    proposition: p10
    trope: none
    answer: woman-approached
    options: [name-called, elder-spoke, woman-approached, group-leaving, sky-darkened]
  - id: q02
    proposition: p02
    trope: subverted
    answer: woman
    options: [man, elder, woman, blacksmith, shepherd]
  - id: q03
    proposition: p13
    trope: follows
    answer: red-cloth
    options: [white-stone, red-cloth, wooden-sign, blue-rope, metal-rod]
  - id: q04
    proposition: p07
    trope: subverted
    answer: man
    options: [man, elder, woman, blacksmith, shepherd]
  - id: q05
    proposition: p11
    trope: none
    answer: not-in-text
    options: [ten-years, twenty-five-years, fifty-years, hundred-years, two-hundred-years]
  - id: q06
    proposition: p01
    trope: none
    answer: east
    options: [north, northeast, east, south, west]
  - id: q07
    proposition: p12
    trope: follows
    answer: storm
    options: [storm, lightning, flood, earthquake, wind]
  - id: q08
    proposition: p08
    trope: subverted
    answer: yellow
    options: [vanished, blue, red, yellow, stayed-white]
  - id: q09
    proposition: p03
    trope: follows
    answer: fallen-tree
    options: [fallen-tree, riverbank, old-well, under-rock, field-fence]
  - id: q10
    proposition: p04
    trope: subverted
    answer: four
    options: [one, two, three, four, five]

locales:
  ja-Jpan:
    text: >-
      {p01:嵐の翌朝、美咲は村の東側にある畑を調べるため、村を出た。}{p03:倒れた木のそばで}、{p04:四つの白い円が描かれた黒い金属製の物体}を{p02:発見した}。{p05:彼女は村へ戻り、長老と健太という男性を現場へ連れてきた。}{p06:長老は物体に触れずにその周囲を調べたが}、{p07:健太は円の一つに手を触れた}。数秒後、{p08:円は黄色に変わり}、{p09:物体は人間の形をした機械へと変形した}。{p10:その機械は、美咲が近づくまで何も話さなかった}。そして、{p11:自分は長年地中に埋まっており}、{p12:嵐によってようやく地上に露出した}のだと説明した。村へ戻る前に、{p13:長老は再び場所が分かるよう、倒れた木に赤い布を結びつけた}。
    notInText: 本文からはわからない
    questions:
      q01:
        prompt: 何がきっかけで機械は話し始めましたか？
        options:
          name-called: 誰かが機械の名前を呼んだ
          elder-spoke: 長老が機械に話しかけた
          woman-approached: 美咲が機械に近づいた
          group-leaving: 一行が立ち去ろうとした
          sky-darkened: 空が急に暗くなった
      q02:
        prompt: 金属製の物体を最初に発見したのは誰ですか？
        options:
          man: 健太
          elder: 長老
          woman: 美咲
          blacksmith: 鍛冶屋
          shepherd: 羊飼い
      q03:
        prompt: 長老はその場所の目印として何を使いましたか？
        options:
          white-stone: 白い石
          red-cloth: 赤い布
          wooden-sign: 木の標識
          blue-rope: 青い縄
          metal-rod: 金属製の棒
      q04:
        prompt: 最初に金属製の物体に触れたのは誰ですか？
        options:
          man: 健太
          elder: 長老
          woman: 美咲
          blacksmith: 鍛冶屋
          shepherd: 羊飼い
      q05:
