        options:
          coins: 硬貨
          letters: 手紙
          seeds: 種
          tools: 道具
          cloth: 布
  en-Latn:
    text: >-
      The morning after a storm, Mira found a black box with four white circles painted on it near a fallen tree. When Mira came back with the elder and Thomas, Thomas touched one of the circles, and it glowed yellow. The box said nothing until the elder called its name.
    spans:
