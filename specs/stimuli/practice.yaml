      p02: "near a fallen tree"
      p03: "four white circles"
      p04: "a black box"
      p05: "Mira came back with the elder and Thomas"
      p06: "Thomas touched one of the circles"
      p07: "it glowed yellow"
      p08: "The box said nothing until the elder called its name"
    notInText: The text does not say
    questions:
      q01:
        prompt: Who found the box?
