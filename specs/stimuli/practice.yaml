# 練習用の刺激（全参加者に固定で提示し、分析対象外）
#
# 構成:
#   propositions: 言語に依存しない命題のリスト。summary は作成者向けの説明で、プログラムは使わない。
#                 並び順は日本語版の本文での登場順としているが、言語によって登場順が異なってもよい。
#   questions:    言語に依存しない設問の定義。
#                 answer は正答の選択肢 ID。「本文からはわからない」が正答の場合は not-in-text とする。
#                 options は具体的な回答候補五つの ID。表示時にシャッフルし、「本文からはわからない」は常に最後に置く。
#                 trope は設問で問う事実が物語の定番どおりか（follows）、定番から外したか（subverted）、
#                 定番と関係しないか（none）を表す（AGENTS.md §3.2）。
#   locales:      言語ごとの本文・設問文・選択肢の文言。キーは Language のタグ（ja-Jpan、en-Latn）。
#                 notInText は「本文からはわからない」の文言。
#                 text は参加者が読む本文そのもの。
#                 spans には、命題ごとに、その内容を担う部分を本文からそのまま引用する（AGENTS.md §10.1）。
#                   - すべての命題について、本文中にちょうど1回だけ現れる部分を引用する。
#                     同じ語句が本文に2回以上現れる場合は、1回だけになるまで引用を長くする。
#                   - 引用どうしは重ならないようにする。どの命題にも属さない部分は引用しなくてよい。
#                   - 命題の位置（本文の先頭から何文字目か）は、引用が現れる位置から書記素単位で数える。
#                 登場人物の名前は、各言語の母語話者にとって馴染みのある名前にする（言語ごとに異なってよい）。
#                 命題と選択肢 ID では、名前ではなく「女性」「男性」で人物を表す。
#                   女性（woman）: ja 美咲 / en Mira
#                   男性（man）  : ja 健太 / en Thomas

id: practice
role: practice

# 設問の配分（AGENTS.md §4.1）:
#   人物と行動の関係: q01, q04, q05, q07
#   細部            : q03, q06
#   状況            : q02
#   本文からはわからない: q08

propositions:
  - id: p01
    summary: 嵐の翌朝、箱を見つけたのは女性である
  - id: p02
    summary: 箱は倒れた木のそばにあった
  - id: p03
    summary: 箱には白い円が四つ描かれていた
  - id: p04
    summary: 箱は黒かった
  - id: p05
    summary: 女性は長老と男性を連れて戻った
  - id: p06
    summary: 男性が円の一つに触れた
  - id: p07
    summary: 触れられた円は黄色に光った
  - id: p08
    summary: 箱は、長老が名前を呼ぶまで何も話さなかった

questions:
  - id: q01
    proposition: p01
    trope: subverted
    answer: woman
    options: [man, elder, woman, blacksmith, shepherd]
  - id: q02
    proposition: p02
    trope: follows
    answer: fallen-tree
    options: [fallen-tree, riverbank, old-well, under-rock, field-fence]
  - id: q03
    proposition: p03
    trope: subverted
    answer: four
    options: [one, two, three, four, five]
  - id: q04
    proposition: p05
    trope: none
    answer: elder-and-man
    options: [elder-and-man, elder-only, man-only, blacksmith-and-shepherd, village-children]
  - id: q05
    proposition: p06
    trope: subverted
    answer: man
    options: [man, elder, woman, blacksmith, shepherd]
  - id: q06
    proposition: p07
    trope: subverted
    answer: yellow
    options: [vanished, blue, red, yellow, stayed-white]
  - id: q07
    proposition: p08
    trope: none
    answer: name-called
    options: [name-called, woman-approached, someone-sang, rain-started, group-leaving]
  - id: q08
    proposition: p04
    trope: none
    answer: not-in-text
    options: [coins, letters, seeds, tools, cloth]

locales:
  ja-Jpan:
    text: >-
      嵐の翌朝、美咲は倒れた木のそばで、白い円が四つ描かれた黒い箱を見つけた。美咲が長老と健太を連れて戻ると、健太が円の一つに触れ、円は黄色に光った。箱は、長老が名前を呼ぶまで何も話さなかった。
    spans:
      p01: "美咲は"
      p02: "倒れた木のそば"
      p03: "白い円が四つ"
      p04: "黒い箱を見つけた"
      p05: "美咲が長老と健太を連れて戻る"
      p06: "健太が円の一つに触れ"
      p07: "円は黄色に光った"
      p08: "箱は、長老が名前を呼ぶまで何も話さなかった"
    notInText: 本文からはわからない
    questions:
      q01:
        prompt: 箱を見つけたのは誰ですか？
        options:
          man: 健太
          elder: 長老
          woman: 美咲
          blacksmith: 鍛冶屋
          shepherd: 羊飼い
      q02:
        prompt: 箱はどこで見つかりましたか？
        options:
          fallen-tree: 倒れた木のそば
          riverbank: 川岸
          old-well: 古い井戸の中
          under-rock: 大きな岩の下
          field-fence: 畑の柵の近く
      q03:
        prompt: 箱に描かれていた円はいくつでしたか？
        options:
          one: 一つ
          two: 二つ
          three: 三つ
          four: 四つ
          five: 五つ
      q04:
        prompt: 箱を見つけた人は、誰を連れて戻りましたか？
        options:
          elder-and-man: 長老と健太
