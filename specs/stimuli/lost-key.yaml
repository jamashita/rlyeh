  - id: q06
    proposition: p08
    trope: none
    answer: bicycle
    options: [house, bicycle, shed, box, car]
  - id: q07
    proposition: p09
    trope: subverted
    answer: grandmother
    options: [girl-herself, grandmother, mother, fruit-seller, fish-seller]
  - id: q08
    proposition: p10
    trope: none
