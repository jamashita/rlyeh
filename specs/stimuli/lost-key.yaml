# 本番用の刺激：市場で拾われた鍵の持ち主を探す話
#
# 構成は practice.yaml の冒頭のコメントを参照。
# 登場人物（命題と選択肢 ID では役割で表す）:
#   果物を売る女性（fruit-seller）: ja 由美 / en Lucy
#   魚を売る男性（fish-seller）  : ja 健一 / en Tom
#   麦わら帽子の少女（girl）     : 名前なし

id: lost-key
role: main

# 設問の種類ごとの配分（AGENTS.md §4.1）:
#   recognition（単語が見えれば答えられる）: q01, q02, q03, q04, q05
#   relation（単語だけでは答えられない）  : q06, q07, q08
#   inference（考える必要がある）         : q09
#   not-in-text（本文からはわからない）   : q10

propositions:
  - id: p01
    summary: 出来事は雨上がりの朝に起きた
  - id: p02
    summary: 鍵を拾ったのは、果物を売る女性である
  - id: p03
    summary: 鍵は店の前の水たまりにあった
  - id: p04
    summary: 鍵は緑色だった
  - id: p05
    summary: 隣で魚を売る男性は、鍵に見覚えがないと言った
  - id: p06
    summary: 昼過ぎ、少女が店に来た
  - id: p07
    summary: 少女は、鍵は祖母の物だと話した
  - id: p08
    summary: 鍵は自転車の鍵だった
  - id: p09
    summary: 少女は礼に梨を渡した
  - id: p10
    summary: 少女は北の出口から帰った

questions:
  - id: q01
    proposition: p03
    kind: recognition
    trope: follows
    answer: puddle
    options: [puddle, roof, well, bench, stairs]
  - id: q02
    proposition: p04
    kind: recognition
    trope: subverted
    answer: green
    options: [green, red, blue, black, gold]
  - id: q03
    proposition: p08
    kind: recognition
    trope: none
    answer: bicycle
    options: [bicycle, house, shed, box, gate]
  - id: q04
    proposition: p09
    kind: recognition
    trope: none
    answer: pears
    options: [pears, apples, flowers, letter, coins]
  - id: q05
    proposition: p06
    kind: recognition
    trope: none
    answer: early-afternoon
    options: [early-afternoon, evening, midnight, next-day, dusk]
  - id: q06
    proposition: p02
    kind: relation
    trope: none
    answer: fruit-seller
    options: [fruit-seller, fish-seller, girl, flower-seller, guard]
  - id: q07
    proposition: p05
    kind: relation
    trope: follows
    answer: fish-seller
    options: [fish-seller, fruit-seller, girl, flower-seller, guard]
  - id: q08
    proposition: p07
    kind: relation
    trope: subverted
    answer: grandmother
    options: [grandmother, girl-herself, fruit-seller, fish-seller, mother]
  - id: q09
    proposition: p09
    kind: inference
    trope: none
    answer: fruit
    options: [fruit, fish, flowers, bread, vegetables]
  - id: q10
    proposition: p06
    kind: not-in-text
    trope: none
    answer: not-in-text
    options: [night-before, that-morning, weekend-before, day-before, three-days-before]

