locales:
  ja-Jpan:
    text: >-
      雨上がりの朝、市場で果物を売る由美は、店の前の水たまりの中に緑色の鍵を見つけた。鍵には小さな鈴と、三角形の木の札がついていた。由美は隣で魚を売る健一に鍵を見せたが、健一は見覚えがないと言った。昼過ぎ、麦わら帽子をかぶった少女が店に来て、自転車の鍵をなくしたと話した。由美が鍵を渡すと、少女は札の裏に書かれた名前を指さし、それが祖母の名前だと説明した。少女は礼として、鞄から取り出した梨を二つ由美に渡し、北の出口から帰っていった。
