  en-Latn:
    text: >-
      On the morning after the rain, Lucy, who sold fruit at the market, found a green key in a puddle in front of her stall. A small bell and a triangular wooden tag were attached to it. Lucy showed the key to Tom, who sold fish next to her, but Tom said he had never seen it. In the early afternoon, a girl in a straw hat came to the stall and said she had lost the key to her bicycle. When Lucy handed her the key, the girl pointed to a name written on the back of the tag and explained that it was her grandmother's. As thanks, the girl took two pears from her bag and gave them to Lucy, then left by the north exit.
