# 本番用の刺激：市場で拾われた鍵の持ち主を探す話
#
# 構成は practice.yaml の冒頭のコメントを参照。
# 登場人物（命題と選択肢 ID では役割で表す）:
#   果物を売る女性（fruit-seller）: ja 由美 / en Lucy
#   魚を売る男性（fish-seller）  : ja 健一 / en Tom
#   麦わら帽子の少女（girl）     : 名前なし

id: lost-key
role: main

# 設問の配分（AGENTS.md §4.1）:
#   人物と行動の関係: q01, q04, q05, q07
#   細部            : q03, q06
#   状況            : q02
#   本文からはわからない: q08

propositions:
  - id: p01
    summary: 鍵を拾ったのは、果物を売る女性である
  - id: p02
    summary: 鍵は店の前の水たまりの中にあった
  - id: p03
    summary: 鍵は緑色だった
  - id: p04
    summary: 隣で魚を売る男性は、鍵に見覚えがないと言った
  - id: p05
    summary: 昼過ぎ、少女が店に来た
  - id: p06
    summary: 少女は、鍵は祖母の物だと話した
  - id: p07
    summary: 鍵は自転車の鍵だった
  - id: p08
    summary: 少女は礼に梨を渡した
  - id: p09
    summary: 少女は北の出口から帰った

questions:
  - id: q01
    proposition: p01
    trope: none
    answer: fruit-seller
    options: [fruit-seller, fish-seller, girl, flower-seller, guard]
  - id: q02
    proposition: p02
    trope: follows
    answer: puddle
    options: [puddle, fruit-box, roof, fish-stand, stairs]
  - id: q03
    proposition: p03
    trope: subverted
    answer: green
    options: [red, blue, green, black, gold]
  - id: q04
    proposition: p04
    trope: follows
    answer: never-seen
    options: [never-seen, his-own, take-to-police, knows-owner, throw-away]
  - id: q05
    proposition: p06
    trope: subverted
    answer: grandmother
    options: [girl-herself, grandmother, mother, fruit-seller, fish-seller]
  - id: q06
    proposition: p07
    trope: none
    answer: bicycle
    options: [house, bicycle, shed, box, car]
  - id: q07
    proposition: p08
    trope: none
    answer: pears
    options: [apples, pears, flowers, letter, coins]
  - id: q08
    proposition: p05
    trope: none
    answer: not-in-text
    options: [night-before, that-morning, weekend-before, day-before, three-days-before]

locales:
  ja-Jpan:
    text: >-
      雨上がりの朝、果物を売る由美は、店の前の水たまりで緑色の鍵を拾った。隣で魚を売る健一は、見覚えがないと言った。昼過ぎ、店に来た少女は、それは祖母の自転車の鍵だと話し、礼に梨を渡して北の出口から帰った。
    spans:
      p01: "果物を売る由美は"
      p02: "店の前の水たまり"
      p03: "緑色の鍵"
      p04: "隣で魚を売る健一は、見覚えがないと言った"
      p05: "昼過ぎ、店に来た少女"
      p06: "祖母の"
      p07: "自転車の鍵"
      p08: "礼に梨を渡して"
      p09: "北の出口から帰った"
    notInText: 本文からはわからない
    questions:
      q01:
        prompt: 鍵を拾ったのは誰ですか？
        options:
          fruit-seller: 果物を売る女性
          fish-seller: 魚を売る男性
          girl: 店に来た少女
          flower-seller: 花を売る老人
          guard: 市場の警備員
      q02:
        prompt: 鍵はどこで拾われましたか？
        options:
          puddle: 店の前の水たまり
          fruit-box: 果物の箱の中
          roof: 店の屋根の上
          fish-stand: 魚を並べた台の下
          stairs: 市場の階段の下
      q03:
        prompt: 拾われた鍵は何色でしたか？
        options:
          red: 赤色
          blue: 青色
          green: 緑色
          black: 黒色
          gold: 金色
      q04:
        prompt: 魚を売る男性は、鍵について何と言いましたか？
        options:
          never-seen: 見覚えがないと言った
          his-own: 自分の鍵だと言った
          take-to-police: 警察に届けるよう言った
          knows-owner: 持ち主を知っていると言った
          throw-away: 捨てるよう言った
      q05:
        prompt: 少女は、鍵は誰の物だと話しましたか？
        options:
          girl-herself: 少女本人
          grandmother: 少女の祖母
          mother: 少女の母
          fruit-seller: 果物を売る女性
          fish-seller: 魚を売る男性
      q06:
        prompt: 拾われたのは、何の鍵でしたか？
        options:
          house: 家の鍵
          bicycle: 自転車の鍵
          shed: 物置の鍵
          box: 箱の鍵
          car: 車の鍵
      q07:
        prompt: 少女は、お礼に何を渡しましたか？
        options:
          apples: りんご
          pears: 梨
          flowers: 花
          letter: 手紙
          coins: 硬貨
      q08:
        prompt: 鍵がなくなったのは、いつですか？
        options:
          night-before: 前の晩
          that-morning: その日の朝
          weekend-before: 前の週末
          day-before: 前の日の昼
          three-days-before: 三日前
  en-Latn:
    text: >-
      On the morning after the rain, Lucy, who sold fruit, picked up a green key from a puddle in front of her stall. Tom, who sold fish next to her, said he had never seen it. In the early afternoon, a girl came to the stall and said it was the key to her grandmother's bicycle. She gave Lucy pears as thanks and left by the north exit.
    spans:
      p01: "Lucy, who sold fruit, picked up"
      p02: "a puddle in front of her stall"
      p03: "a green key"
      p04: "Tom, who sold fish next to her, said he had never seen it"
      p05: "In the early afternoon, a girl came to the stall"
      p06: "her grandmother's"
      p07: "bicycle"
      p08: "gave Lucy pears as thanks"
      p09: "left by the north exit"
    notInText: The text does not say
    questions:
      q01:
        prompt: Who picked up the key?
        options:
          fruit-seller: The woman who sold fruit
          fish-seller: The man who sold fish
          girl: The girl who came to the stall
          flower-seller: The old man who sold flowers
          guard: A market guard
      q02:
        prompt: Where was the key picked up?
        options:
          puddle: A puddle in front of the stall
          fruit-box: Inside a box of fruit
          roof: On the roof of the stall
          fish-stand: Under the table of fish
          stairs: Under the stairs of the market
      q03:
        prompt: What color was the key that was picked up?
        options:
          red: Red
          blue: Blue
          green: Green
          black: Black
          gold: Gold
      q04:
        prompt: What did the man who sold fish say about the key?
        options:
          never-seen: That he had never seen it
          his-own: That it was his own key
          take-to-police: That she should take it to the police
          knows-owner: That he knew whose it was
          throw-away: That she should throw it away
      q05:
        prompt: Whose did the girl say the key was?
        options:
          girl-herself: Her own
          grandmother: Her grandmother's
          mother: Her mother's
          fruit-seller: The fruit seller's
          fish-seller: The fish seller's
      q06:
        prompt: What was the key that was picked up for?
        options:
          house: A house
          bicycle: A bicycle
          shed: A shed
          box: A box
          car: A car
      q07:
        prompt: What did the girl give as thanks?
        options:
          apples: Apples
          pears: Pears
          flowers: Flowers
          letter: A letter
          coins: Coins
      q08:
        prompt: When was the key lost?
        options:
          night-before: The night before
          that-morning: That morning
          weekend-before: The weekend before
          day-before: The afternoon before
          three-days-before: Three days before
