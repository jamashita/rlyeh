#   果物を売る女性（fruit-seller）: ja 由美 / en Lucy
#   魚を売る男性（fish-seller）  : ja 健一 / en Tom
#   麦わら帽子の少女（girl）     : 名前なし

id: lost-key
role: main

propositions:
  - id: p01
    summary: 鍵を見つけたのは、市場で果物を売る女性である
  - id: p02
    summary: 鍵は店の前の水たまりの中にあった
  - id: p03
    summary: 鍵は緑色だった
  - id: p04
    summary: 鍵には小さな鈴と、三角形の木の札がついていた
  - id: p05
